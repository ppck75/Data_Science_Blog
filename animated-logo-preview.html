<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="3.5;url=main.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Logo Preview</title>
    <style>
      :root {
        --bg: #ffffff;
        --blue-1: #89d5ff;
        --blue-2: #60a9e7;
        --blue-3: #2d7fc8;
        --blue-4: #0f518f;
        --blue-5: #092a61;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 18% 20%, rgba(124, 201, 255, 0.14), transparent 22%),
          radial-gradient(circle at 82% 18%, rgba(117, 185, 240, 0.12), transparent 18%),
          linear-gradient(180deg, #ffffff 0%, #f8fbfe 100%);
        font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(24px, 5vw, 56px);
      }

      svg {
        width: min(92vw, 760px);
        height: auto;
        overflow: visible;
      }

      .splash-field {
        position: relative;
        width: min(100%, 900px);
        min-height: min(86vh, 860px);
        display: grid;
        place-items: center;
      }

      .splash-field::before,
      .splash-field::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .splash-field::before {
        background:
          radial-gradient(circle at center, rgba(87, 179, 248, 0.16), rgba(87, 179, 248, 0.07) 34%, transparent 58%);
        filter: blur(20px);
        animation: haloPulse 4.6s ease-in-out infinite;
      }

      .splash-field::after {
        inset: 10%;
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(81, 173, 255, 0.16), rgba(81, 173, 255, 0.06) 42%, transparent 64%);
        filter: blur(26px);
        animation: logoAura 3.8s ease-in-out infinite;
      }

      .logo-root {
        filter: drop-shadow(0 18px 26px rgba(28, 72, 114, 0.12));
      }

      .network-shell {
        opacity: 0;
        animation:
          revealLogo 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards,
          floatLogo 5.4s ease-in-out 1.15s infinite;
        transform-origin: 400px 400px;
      }

      .network-back {
        transform-origin: 400px 400px;
        animation: spinSlow 36s linear 1.2s infinite;
      }

      .network-mid {
        transform-origin: 400px 400px;
        animation: spinReverse 42s linear 1.2s infinite;
      }

      .network-front {
        transform-origin: 400px 400px;
        animation: spinSlowWide 54s linear 1.2s infinite;
      }

      .orbit {
        fill: none;
        stroke: rgba(90, 166, 226, 0.84);
        stroke-width: 5;
      }

      .line-light {
        stroke: var(--blue-2);
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0.82;
      }

      .line-mid {
        stroke: var(--blue-3);
        stroke-width: 5;
        stroke-linecap: round;
        opacity: 0.92;
      }

      .line-dark {
        stroke: var(--blue-4);
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0.9;
      }

      .node-light {
        fill: var(--blue-1);
      }

      .node-mid {
        fill: var(--blue-3);
      }

      .node-dark {
        fill: var(--blue-5);
      }

      .node-large {
        animation: pulseNode 4.4s ease-in-out infinite;
        transform-origin: center;
      }

      .node-small {
        animation: pulseNode 5.6s ease-in-out infinite;
        transform-origin: center;
      }

      .label-group {
        opacity: 0;
        transform: translateX(-24px);
        animation: revealLabel 1s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards;
        isolation: isolate;
      }

      .label-image {
        filter: url(#imageShadow);
      }

      .label-aura {
        opacity: 0.98;
        animation: logoAura 4.2s ease-in-out infinite;
        transform-origin: 400px 430px;
      }

      .badge-glow {
        opacity: 0.78;
        animation: haloPulse 4s ease-in-out infinite;
      }

      .progress {
        position: fixed;
        left: 50%;
        bottom: clamp(26px, 5vh, 42px);
        transform: translateX(-50%);
        width: min(72vw, 300px);
        height: 3px;
        border-radius: 999px;
        background: rgba(172, 223, 255, 0.24);
        overflow: hidden;
        z-index: 5;
      }

      .progress::after {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(114, 216, 255, 0.2), rgba(79, 168, 255, 0.95), rgba(143, 227, 255, 0.42));
        transform-origin: left center;
        animation: loadBar 3.5s linear forwards;
      }

      @keyframes revealLogo {
        from {
          opacity: 0;
          transform: translateX(-38px) scale(0.985);
          clip-path: inset(0 100% 0 0 round 50%);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
          clip-path: inset(0 0 0 0 round 50%);
        }
      }

      @keyframes revealLabel {
        from {
          opacity: 0;
          transform: translateX(-26px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes floatLogo {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes spinSlow {
        from {
          rotate: 0deg;
        }
        to {
          rotate: 360deg;
        }
      }

      @keyframes spinReverse {
        from {
          rotate: 0deg;
        }
        to {
          rotate: -360deg;
        }
      }

      @keyframes spinSlowWide {
        from {
          rotate: 0deg;
        }
        to {
          rotate: 360deg;
        }
      }

      @keyframes pulseNode {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes haloPulse {
        0%,
        100% {
          opacity: 0.56;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1.015);
        }
      }

      @keyframes logoAura {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }

      @keyframes loadBar {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @media (max-width: 720px) {
        svg {
          width: min(96vw, 640px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
